# =============================================================================
# Render Blueprint Configuration (render.yaml)
# British Auction RFQ System
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: rfq-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: cd backend && alembic upgrade head
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONPATH
        value: backend
      - key: DATABASE_URL
        sync: false # Set to your Neon PostgreSQL connection string
      - key: REDIS_URL
        sync: false # Set to your Upstash Redis rediss:// string
      - key: CORS_ORIGIN
        sync: false # Set to your deployed frontend URL (e.g., https://rfq-frontend.onrender.com)

  # ---------------------------------------------------------------------------
  # 2. Celery Worker (Background Worker for asynchronous auction tasks)
  # ---------------------------------------------------------------------------
  - type: worker
    name: rfq-celery-worker
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && celery -A app.core.celery_app.celery_app worker -l info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONPATH
        value: backend
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  # ---------------------------------------------------------------------------
  # 3. Celery Beat (Periodic scheduler for auction auto-finalization)
  # ---------------------------------------------------------------------------
  - type: worker
    name: rfq-celery-beat
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && celery -A app.core.celery_app.celery_app beat -l info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONPATH
        value: backend
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  # ---------------------------------------------------------------------------
  # 4. React Frontend (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: rfq-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to https://rfq-backend.onrender.com/api/v1
